name: Tests

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
        php: ['8.2', '8.3', '8.4', '8.5']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@v4

    - name: Set up PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php }}
        extensions: ctype, dom, mbstring, xml, xmlwriter
        coverage: none
        tools: composer:v2

    - name: Validate composer.json and composer.lock
      run: composer validate --strict

    - name: Install dependencies
      run: composer install --prefer-dist --no-progress

    - name: Run test suite
      run: composer run-script test

    - name: Check documentation examples and local links
      run: composer run-script test:docs

    - name: Verify targeted language fault detection
      run: composer run-script test:mutations

    - name: Run extended reproducible stress campaigns
      env:
        PROCER_FUZZ_CASES: '10000'
        PROCER_FUZZ_SEED: ${{ github.run_number }}
      run: composer run-script test:stress
